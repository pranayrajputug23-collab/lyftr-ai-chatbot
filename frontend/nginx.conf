server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Browser code calls same-origin /api/*; Docker DNS stays inside Nginx.
    # The trailing slash removes the /api prefix before forwarding upstream.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep Vite's client-side entry route available if the UI adds routes later.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
