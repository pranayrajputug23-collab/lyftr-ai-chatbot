name: lyftr-ai

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      # Quick Tunnel on the EC2 host reaches FastAPI via loopback. Do not expose
      # the backend port directly to the public network.
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: "${DATABASE_URL:-sqlite:////data/app.db}"
      LLM_API_KEYS: "${LLM_API_KEYS:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      LLM_API_BASE: "${LLM_API_BASE:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000}"
      ENABLE_FAILURE_SIMULATION: "${ENABLE_FAILURE_SIMULATION:-false}"
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
      LITELLM_CACHE_TYPE: "${LITELLM_CACHE_TYPE:-local}"
    volumes:
      - lyftr_sqlite_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/api}"
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  lyftr_sqlite_data:
    name: lyftr_ai_sqlite_data
